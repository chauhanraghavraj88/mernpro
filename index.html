  <script>
function getData() {
    return new Promise(function(resolve) {
        setTimeout(function() {
            resolve("Data received Successfully");
        }, 3000);
    });
}
//   getData().then(function(data){console.log(data);});
async function showData(){
    try{
    const data = await getData();
    console.log(data);
    }
    catch
    {
        console.log("Error occurs")
    }
}
 showData();
